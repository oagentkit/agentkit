name: CI

# 退役仓契约检查：本仓已于 v1.9.0 整仓退役（48 个兼容转发子包全删、零代码、
# 零依赖），不再跑 Go 构建门禁——「仓里没有任何 .go」正是要守的不变量。
# 历史上的 shared go-ci（Lint & Test）、facade-symbols（符号级转发完整性）、
# facade-contract（门面治理契约）三个 job 随门面一起退役，由本 job 接管
# 「墓碑形状」的机器约束。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retired-contract:
    name: Retired contract（退役墓碑形状）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 —— README 状态行判据要 git describe --tags（沿用 #192 的
      # 浅克隆教训：没有 tag 会让判据 fail-closed 假红）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 仓里不得再有任何 .go 文件（退役 = 不再提供 API）
        run: |
          bad=$(find . -name '*.go' -not -path './.git/*')
          if [ -n "$bad" ]; then
            echo "::error::退役仓出现 .go 文件（复活包请去上游模块仓，不要在这里加回 alias）："
            echo "$bad"
            exit 1
          fi
          echo "OK：零 .go 文件"

      - name: go.mod 只许 module 声明（零依赖墓碑）
        run: |
          if grep -qE '^[[:space:]]*(require|exclude|replace)[ (]' go.mod; then
            echo "::error::go.mod 出现 require/exclude/replace——墓碑长出了依赖"
            exit 1
          fi
          if ! grep -q '^module github.com/oagentkit/agentkit$' go.mod; then
            echo "::error::go.mod 缺 module github.com/oagentkit/agentkit 声明"
            exit 1
          fi
          echo "OK：go.mod = module 声明 + 零依赖"

      - name: README 退役公告与状态行不得落后最新 tag（刷正纪律，沿用 #192）
        run: |
          latest=$(git describe --tags --abbrev=0)
          readme=$(grep -oE '当前 v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1 | sed 's/^当前 //')
          if [ -z "$readme" ]; then
            echo "::error::README 状态行找不到「当前 vX.Y.Z」判据"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$latest" "$readme" | sort -V | head -n1)" != "$latest" ]; then
            echo "::error::README 状态行 $readme 落后最新 tag $latest——刷正纪律断更"
            exit 1
          fi
          if ! grep -q '已退役' README.md; then
            echo "::error::README 缺「已退役」公告标记"
            exit 1
          fi
          echo "OK：README 退役公告在，状态行 $readme ≥ 最新 tag $latest"

      - name: 48 包对照表行数守恒（迁移指引是墓碑的唯一正文）
        run: |
          n=$(grep -cE '^\| `[a-z0-9]+` \| [a-z]+ \| `github\.com/oagentkit/' README.md)
          if [ "$n" -ne 48 ]; then
            echo "::error::README 对照表应有 48 行，实际 $n——包表增删都要给出理由"
            exit 1
          fi
          echo "OK：对照表 48 行"
